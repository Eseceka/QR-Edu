<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Edu</title>
<meta name="robots" content="noindex">
<style>
html,body{height:100%;margin:0;background:#000}
body{display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.player{position:fixed;inset:0;background:#000}
#player{width:100%;height:100%;border:0}
noscript{color:#fff;text-align:center;padding:24px}
</style>
</head>
<body>
<div class="player"><div id="player"></div></div>
<script>
const videoIds=[
"Mqokmn0WOMo",
"wihSHRY2JME",
"_Q2BtlmqqZA"
];
let player;

function onYouTubeIframeAPIReady(){
  player=new YT.Player("player",{
    width:"100%",
    height:"100%",
    playerVars:{
      autoplay:1,
      playsinline:1,
      rel:0
    },
    events:{
      onReady(event){
        event.target.loadPlaylist({
          playlist:videoIds,
          index:0,
          startSeconds:0
        });
        event.target.setLoop(true);
      },
      onStateChange(event){
        if(event.data===YT.PlayerState.ENDED){
          event.target.playVideoAt(0);
        }
      }
    }
  });
}

const api=document.createElement("script");
api.src="https://www.youtube.com/iframe_api";
document.head.appendChild(api);
</script>
<noscript>Necesitas JavaScript habilitado para reproducir los videos.</noscript>
</body>
</html>
